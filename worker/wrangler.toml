# Configuration du déploiement automatique du Worker (GitHub Actions → Cloudflare).
# Les secrets (BACKUP_TOKEN, GEMINI_API_KEY) ne sont PAS ici : ils restent dans Cloudflare
# et ne sont pas modifiés par le déploiement.

name = "manga-gemini-proxy"
main = "worker.js"
compatibility_date = "2026-09-18"
workers_dev = true

# Garde les variables saisies dans le tableau de bord Cloudflare (ex. GEMINI_MODELES)
keep_vars = true

# Stockage des sauvegardes. L'identifiant se trouve dans Cloudflare : Storage & Databases → KV → MANGA_KV
[[kv_namespaces]]
binding = "MANGA_KV"
id = "13be37510f86416f816f1c585d26b098"
