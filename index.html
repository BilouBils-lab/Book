<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mes Mangas</title>

  <!-- PWA iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mangas">
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/180/manga.png">
  <link rel="manifest" href='data:application/manifest+json,{"name":"Suivi Manga","short_name":"Mangas","start_url":"./index.html","display":"standalone","background_color":"#121212","theme_color":"#121212"}'>

  <!-- Library OCR Tesseract.js -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #1a1a1e;
      --card-border: #2a2a30;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --success: #10b981;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 90px;
    }

    header {
      position: sticky;
      top: 0;
      background-color: rgba(15, 15, 18, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 12px 16px 0 16px;
      border-bottom: 1px solid var(--card-border);
      z-index: 100;
    }

    .top-bars {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .app-title-group {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .app-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .settings-btn {
      background: transparent;
      border: none;
      font-size: 20px;
      color: var(--text-sub);
      cursor: pointer;
      padding: 4px;
    }

    .tabs-nav {
      display: flex;
      gap: 8px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 16px;
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      position: relative;
      text-align: center;
    }

    .tab-btn.active {
      color: var(--text-main);
    }

    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 15%;
      width: 70%;
      height: 3px;
      background-color: var(--accent);
      border-radius: 3px 3px 0 0;
    }

    main {
      padding: 16px;
      max-width: 650px;
      margin: 0 auto;
    }

    .series-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .series-card:active {
      transform: scale(0.99);
    }

    .cover-thumb {
      width: 65px;
      height: 95px;
      border-radius: 6px;
      object-fit: cover;
      background-color: #2a2a30;
      flex-shrink: 0;
    }

    .series-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .series-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
    }

    .series-meta {
      font-size: 13px;
      color: var(--text-sub);
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background-color: #2a2a30;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }

    .progress-bar-fill {
      height: 100%;
      background-color: var(--accent);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .chevron {
      color: var(--text-sub);
      font-size: 18px;
      padding-left: 4px;
    }

    .pal-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pal-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .pal-title {
      font-size: 15px;
      font-weight: 600;
    }

    .pal-tome {
      font-size: 13px;
      color: var(--accent);
      font-weight: 500;
    }

    .btn-read-action {
      background: #2a2a30;
      border: none;
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .actions-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 99;
    }

    .btn-fab {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 24px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-fab-secondary {
      background: #2a2a30;
      color: var(--text-main);
      border: 1px solid var(--card-border);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
    }

    .btn-secondary {
      background: #2a2a30;
      color: white;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 200;
      padding: 16px;
      overflow-y: auto;
    }

    .modal-overlay.active {
      display: block;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      position: relative;
    }

    .modal-header {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
    }

    .modal-cover {
      width: 90px;
      height: 135px;
      border-radius: 8px;
      object-fit: cover;
      background: #2a2a30;
      cursor: pointer;
    }

    .modal-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }

    .close-modal {
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: 24px;
      background: none;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
    }

    .volumes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(42px, 1fr));
      gap: 8px;
      margin-top: 16px;
    }

    .tome-box {
      height: 42px;
      border-radius: 8px;
      background: #2a2a30;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      border: 1px solid transparent;
      transition: all 0.15s ease;
      position: relative;
    }

    .tome-box.owned {
      background: rgba(37, 99, 235, 0.15);
      color: var(--accent);
      border-color: var(--accent);
    }

    .tome-box.read {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-sub);
      font-size: 14px;
    }

    .version-tag {
      position: fixed;
      bottom: 6px;
      right: 10px;
      font-size: 10px;
      color: var(--text-sub);
      opacity: 0.5;
      font-family: monospace;
      pointer-events: none;
    }

    .settings-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    #loader-ocr {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 15, 18, 0.9);
      z-index: 300;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--card-border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <header>
    <div class="top-bars">
      <div class="app-title-group">
        <div class="app-title">Ma MangaThèque</div>
        <div style="font-size: 12px; color: var(--text-sub);" id="total-count">0 tomes</div>
      </div>
      <button class="settings-btn" onclick="ouvrirParametres()" aria-label="Réglages">⚙️</button>
    </div>
    <div class="tabs-nav">
      <button class="tab-btn" id="tab-pal-btn" onclick="changerOnglet('pal')">Pile à lire (<span id="pal-count">0</span>)</button>
      <button class="tab-btn active" id="tab-col-btn" onclick="changerOnglet('collection')">Collection</button>
    </div>
  </header>

  <main>
    <div id="view-pal" style="display: none;"></div>
    <div id="view-collection"></div>
  </main>

  <div class="actions-bar">
    <button class="btn-fab btn-fab-secondary" onclick="document.getElementById('ocr-file-input').click()">📷 Scan</button>
    <button class="btn-fab" onclick="ajouterManuel()">➕ Ajouter</button>
  </div>

  <input type="file" id="ocr-file-input" style="display: none;" accept="image/*" capture="environment" onchange="traiterScanJaquette(event)">

  <div id="loader-ocr">
    <div class="spinner"></div>
    <div id="loader-status" style="font-size: 14px; font-weight: 600;">Analyse de la jaquette...</div>
  </div>

  <div class="version-tag">v2.7</div>

  <!-- Modal Réglages / Paramètres -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal-content">
      <button class="close-modal" onclick="fermerParametres()">×</button>
      <h2 style="font-size: 18px; margin-bottom: 16px;">Paramètres</h2>
      
      <div class="settings-list">
        <button class="btn btn-secondary" onclick="exporterSauvegarde()">📥 Exporter la sauvegarde (JSON)</button>
        <button class="btn btn-secondary" onclick="document.getElementById('file-input').click()">📤 Importer la sauvegarde (JSON)</button>
        <button class="btn btn-secondary" onclick="document.getElementById('csv-input').click()">📊 Importer un fichier CSV (Sheets)</button>
      </div>

      <input type="file" id="file-input" style="display: none;" accept=".json" onchange="importerSauvegarde(event)">
      <input type="file" id="csv-input" style="display: none;" accept=".csv" onchange="importerCSV(event)">
      <input type="file" id="cover-file-input" style="display: none;" accept="image/*" onchange="chargerJaquetteFichier(event)">
    </div>
  </div>

  <!-- Modal Détail Série -->
  <div id="detail-modal" class="modal-overlay">
    <div class="modal-content">
      <button class="close-modal" onclick="fermerModal()">×</button>
      <div class="modal-header">
        <div style="position: relative;">
          <img id="modal-cover" class="modal-cover" src="" alt="Jaquette" onclick="ouvrirMenuImage()">
          <div style="position: absolute; bottom: 4px; right: 4px; background: rgba(0,0,0,0.6); color: white; padding: 2px 4px; border-radius: 4px; font-size: 10px;">✏️</div>
        </div>
        <div class="modal-info">
          <h2 id="modal-title" style="font-size: 18px;"></h2>
          <div id="modal-author" style="font-size: 13px; color: var(--text-sub);"></div>
        </div>
      </div>

      <div style="font-size: 12px; margin-bottom: 8px; color: var(--text-sub); display: flex; justify-content: space-between; align-items: center;">
        <span>Clic: Statut | Appui long: Supprimer tome</span>
      </div>
      
      <div id="modal-volumes-grid" class="volumes-grid"></div>
      
      <div style="margin-top: 16px; display: flex; justify-content: space-between;">
        <button class="btn btn-secondary" style="font-size: 12px; width: auto;" onclick="ajouterNouveauTomeModal()">+ Ajouter tome</button>
        <button class="btn btn-secondary" style="font-size: 12px; width: auto; background: rgba(239,68,68,0.2); color: #ef4444;" onclick="supprimerSerieActuelle()">Supprimer la série</button>
      </div>
    </div>
  </div>

  <script>
    let bibliotheque = JSON.parse(localStorage.getItem('mangas_db')) || [];
    let ongletActif = 'collection';
    let serieIndexActive = null;
    let longPressTimer = null;

    function sauvegarder() {
      localStorage.setItem('mangas_db', JSON.stringify(bibliotheque));
      rendreVues();
    }

    function ouvrirParametres() {
      document.getElementById('settings-modal').classList.add('active');
    }

    function fermerParametres() {
      document.getElementById('settings-modal').classList.remove('active');
    }

    async function traiterScanJaquette(event) {
      const file = event.target.files[0];
      if (!file) return;

      const loader = document.getElementById('loader-ocr');
      const loaderStatus = document.getElementById('loader-status');
      loader.style.display = 'flex';
      loaderStatus.innerText = "Lecture du texte...";

      try {
        const worker = await Tesseract.createWorker('eng+fra');
        const ret = await worker.recognize(file);
        await worker.terminate();

        const lignes = ret.data.text.split('\n')
          .map(l => l.trim())
          .filter(l => l.length > 2 && !/^\d+$/.test(l));

        loader.style.display = 'none';

        if (lignes.length === 0) {
          alert("Impossible de lire le titre sur l'image. Essaie avec un éclairage plus direct.");
          return;
        }

        const texteSuggere = lignes[0];
        const titreFinal = prompt("Titre détecté (à ajuster si besoin) :", texteSuggere);
        
        if (titreFinal) {
          let tomeNum = parseInt(prompt("Numéro du tome :", "1")) || 1;
          enregistrerSerie(titreFinal.trim(), tomeNum);
        }
      } catch (e) {
        loader.style.display = 'none';
        alert("Erreur lors de l'analyse OCR.");
      }
      event.target.value = '';
    }

    function ouvrirMenuImage() {
      const choix = prompt("Option jaquette :\n1 = Importer une image depuis ton téléphone\n2 = Coller un lien URL d'image", "1");
      if (choix === "1") {
        document.getElementById('cover-file-input').click();
      } else if (choix === "2") {
        const url = prompt("Lien de l'image :");
        if (url) {
          bibliotheque[serieIndexActive].couverture = url.trim();
          sauvegarder();
        }
      }
    }

    function chargerJaquetteFichier(e) {
      const file = e.target.files[0];
      if (!file || serieIndexActive === null) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.src = evt.target.result;
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const maxDim = 300;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > maxDim) {
              height *= maxDim / width;
              width = maxDim;
            }
          } else {
            if (height > maxDim) {
              width *= maxDim / height;
              height = maxDim;
            }
          }

          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);
          
          bibliotheque[serieIndexActive].couverture = canvas.toDataURL('image/jpeg', 0.8);
          sauvegarder();
        };
      };
      reader.readAsDataURL(file);
    }

    function parseCSVLine(text) {
      let p = '', c = '', r = [];
      let q = false;
      for (let i = 0; i < text.length; i++) {
        c = text[i];
        if (c === '"') {
          q = !q;
        } else if (c === ',' && !q) {
          r.push(p.trim());
          p = '';
        } else {
          p += c;
        }
      }
      r.push(p.trim());
      return r;
    }

    function importerCSV(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const lignes = e.target.result.split(/\r?\n/);
        let ajouts = 0;

        lignes.forEach((ligne, index) => {
          if (!ligne.trim() || index === 0) return;
          
          const cols = parseCSVLine(ligne);
          if (cols.length < 2) return;

          const titre = cols[1] ? cols[1].replace(/^"|"$/g, '').trim() : '';
          const brutTomesPossedes = cols[2] ? cols[2].replace(/^"|"$/g, '').trim() : '';
          const tomesLusVal = cols[3] ? parseInt(cols[3].trim()) || 0 : 0;

          if (titre && titre.toLowerCase() !== 'série') {
            importerMangaDepuisCSV(titre, brutTomesPossedes, tomesLusVal);
            ajouts++;
          }
        });

        fermerParametres();
        alert(`${ajouts} série(s) importée(s) avec succès !`);
      };
      reader.readAsText(file);
    }

    function importerMangaDepuisCSV(titreSerie, stringTomes, nbTomesLus) {
      let setPossedes = new Set();
      const matches = stringTomes.match(/\d+/g);
      if (matches) {
        if (stringTomes.includes(',') || stringTomes.includes(';')) {
          matches.forEach(num => setPossedes.add(parseInt(num)));
        } else {
          const max = parseInt(matches[0]);
          for (let i = 1; i <= max; i++) setPossedes.add(i);
        }
      }

      const maxTomeCount = setPossedes.size > 0 ? Math.max(...Array.from(setPossedes), nbTomesLus) : (nbTomesLus || 1);

      let initialTomes = [];
      for (let i = 1; i <= maxTomeCount; i++) {
        const estPossede = setPossedes.has(i) || (matches && matches.length === 1 && i <= parseInt(matches[0]));
        const estLu = i <= nbTomesLus;
        initialTomes.push({
          numero: i,
          possede: estPossede || estLu,
          lu: estLu
        });
      }

      let mangaIndex = bibliotheque.findIndex(m => m.titre.toLowerCase() === titreSerie.toLowerCase());

      if (mangaIndex === -1) {
        bibliotheque.push({
          titre: titreSerie,
          auteur: '',
          couverture: '',
          tomes: initialTomes
        });
        mangaIndex = bibliotheque.length - 1;
      } else {
        bibliotheque[mangaIndex].tomes = initialTomes;
      }

      sauvegarder();
    }

    function exporterSauvegarde() {
      if (bibliotheque.length === 0) {
        alert("Ta bibliothèque est vide, rien à exporter.");
        return;
      }
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(bibliotheque, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `mangas_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importerSauvegarde(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedData = JSON.parse(e.target.result);
          if (Array.isArray(importedData)) {
            if (confirm("Remplacer la bibliothèque actuelle par cette sauvegarde ?")) {
              bibliotheque = importedData;
              sauvegarder();
              fermerParametres();
              alert("Bibliothèque restaurée avec succès !");
            }
          } else {
            alert("Format de fichier invalide.");
          }
        } catch (err) {
          alert("Erreur lors de la lecture du fichier JSON.");
        }
      };
      reader.readAsText(file);
    }

    function changerOnglet(onglet) {
      ongletActif = onglet;
      document.getElementById('tab-pal-btn').classList.toggle('active', onglet === 'pal');
      document.getElementById('tab-col-btn').classList.toggle('active', onglet === 'collection');
      
      document.getElementById('view-pal').style.display = onglet === 'pal' ? 'block' : 'none';
      document.getElementById('view-collection').style.display = onglet === 'collection' ? 'block' : 'none';
      
      rendreVues();
    }

    function rendreVues() {
      let totalPossedes = 0;
      let elementsPAL = [];

      bibliotheque.forEach((serie, sIndex) => {
        serie.tomes.forEach((tome, tIndex) => {
          if (tome.possede) {
            totalPossedes++;
            if (!tome.lu) {
              elementsPAL.push({ serieIndex: sIndex, tomeIndex: tIndex, titre: serie.titre, numero: tome.numero });
            }
          }
        });
      });

      document.getElementById('total-count').innerText = `${totalPossedes} tome(s)`;
      document.getElementById('pal-count').innerText = elementsPAL.length;

      const containerPAL = document.getElementById('view-pal');
      containerPAL.innerHTML = '';
      if (elementsPAL.length === 0) {
        containerPAL.innerHTML = `<div class="empty-state">Aucun manga dans la pile à lire. 🎉</div>`;
      } else {
        elementsPAL.forEach(item => {
          const div = document.createElement('div');
          div.className = 'pal-item';
          div.innerHTML = `
            <div class="pal-info">
              <div class="pal-title">${item.titre}</div>
              <div class="pal-tome">Tome ${item.numero}</div>
            </div>
            <button class="btn-read-action" onclick="marquerCommeLu(${item.serieIndex}, ${item.tomeIndex})">Marquer lu ✓</button>
          `;
          containerPAL.appendChild(div);
        });
      }

      const containerCol = document.getElementById('view-collection');
      containerCol.innerHTML = '';
      if (bibliotheque.length === 0) {
        containerCol.innerHTML = `<div class="empty-state">Ta collection est vide.<br>Clique sur ⚙️ pour importer un CSV ou sur ➕ pour ajouter une série.</div>`;
      } else {
        bibliotheque.forEach((serie, index) => {
          const possedes = serie.tomes.filter(t => t.possede).length;
          const lus = serie.tomes.filter(t => t.lu).length;
          const totalRef = serie.tomes.length;
          const pourcentage = totalRef > 0 ? Math.min(100, Math.round((lus / totalRef) * 100)) : 0;

          const card = document.createElement('div');
          card.className = 'series-card';
          card.onclick = () => ouvrirModalSerie(index);
          card.innerHTML = `
            <img class="cover-thumb" src="${serie.couverture || 'https://via.placeholder.com/65x95?text=Manga'}" alt="Jaquette" onerror="this.src='https://via.placeholder.com/65x95?text=No+Cover'">
            <div class="series-details">
              <div class="series-title">${serie.titre}</div>
              <div class="series-meta">${possedes} possédé(s) · ${lus}/${totalRef} lu(s)</div>
              <div class="progress-bar-bg">
                <div class="progress-bar-fill" style="width: ${pourcentage}%;"></div>
              </div>
            </div>
            <div class="chevron">›</div>
          `;
          containerCol.appendChild(card);
        });
      }

      if (serieIndexActive !== null && bibliotheque[serieIndexActive]) {
        remplirModalSerie(serieIndexActive);
      }
    }

    function marquerCommeLu(sIndex, tIndex) {
      bibliotheque[sIndex].tomes[tIndex].lu = true;
      sauvegarder();
    }

    function ouvrirModalSerie(index) {
      serieIndexActive = index;
      remplirModalSerie(index);
      document.getElementById('detail-modal').classList.add('active');
    }

    function remplirModalSerie(index) {
      const serie = bibliotheque[index];
      document.getElementById('modal-title').innerText = serie.titre;
      document.getElementById('modal-author').innerText = serie.auteur || 'Auteur inconnu';
      document.getElementById('modal-cover').src = serie.couverture || 'https://via.placeholder.com/90x135?text=Manga';

      const grid = document.getElementById('modal-volumes-grid');
      grid.innerHTML = '';

      serie.tomes.forEach((tome, tIndex) => {
        let classe = 'tome-box';
        if (tome.lu) classe += ' read';
        else if (tome.possede) classe += ' owned';

        const box = document.createElement('div');
        box.className = classe;
        box.innerText = tome.numero;
        
        box.onclick = () => toggleTomeState(index, tIndex);
        
        box.oncontextmenu = (e) => {
          e.preventDefault();
          supprimerTomeUnique(index, tIndex);
        };

        box.ontouchstart = () => {
          longPressTimer = setTimeout(() => {
            supprimerTomeUnique(index, tIndex);
          }, 600);
        };
        box.ontouchend = () => clearTimeout(longPressTimer);
        box.ontouchmove = () => clearTimeout(longPressTimer);

        grid.appendChild(box);
      });
    }

    function toggleTomeState(sIndex, tIndex) {
      const tome = bibliotheque[sIndex].tomes[tIndex];
      if (!tome.possede) {
        tome.possede = true;
        tome.lu = false;
      } else if (tome.possede && !tome.lu) {
        tome.lu = true;
      } else {
        tome.possede = false;
        tome.lu = false;
      }
      sauvegarder();
    }

    function supprimerTomeUnique(sIndex, tIndex) {
      const tome = bibliotheque[sIndex].tomes[tIndex];
      if (confirm(`Supprimer le tome ${tome.numero} de la liste ?`)) {
        bibliotheque[sIndex].tomes.splice(tIndex, 1);
        sauvegarder();
      }
    }

    function ajouterNouveauTomeModal() {
      if (serieIndexActive === null) return;
      const serie = bibliotheque[serieIndexActive];
      const maxNum = serie.tomes.length > 0 ? serie.tomes[serie.tomes.length - 1].numero : 0;
      serie.tomes.push({ numero: maxNum + 1, possede: true, lu: false });
      sauvegarder();
    }

    function supprimerSerieActuelle() {
      if (serieIndexActive === null) return;
      if (confirm(`Supprimer complètement "${bibliotheque[serieIndexActive].titre}" de ta collection ?`)) {
        bibliotheque.splice(serieIndexActive, 1);
        fermerModal();
        sauvegarder();
      }
    }

    function fermerModal() {
      document.getElementById('detail-modal').classList.remove('active');
      serieIndexActive = null;
    }

    function enregistrerSerie(titre, tomeNum) {
      let mangaIndex = bibliotheque.findIndex(m => m.titre.toLowerCase() === titre.toLowerCase());
      let inclurePrecedents = false;

      if (tomeNum > 1) {
        inclurePrecedents = confirm(`Tu ajoutes le tome ${tomeNum} de "${titre}".\n\nPossèdes-tu aussi tous les tomes de 1 à ${tomeNum - 1} ?`);
      }

      if (mangaIndex !== -1) {
        let manga = bibliotheque[mangaIndex];
        for (let i = 1; i <= tomeNum; i++) {
          if ((i === tomeNum) || inclurePrecedents) {
            let tomeExist = manga.tomes.find(t => t.numero === i);
            if (tomeExist) {
              tomeExist.possede = true;
            } else {
              manga.tomes.push({ numero: i, possede: true, lu: false });
            }
          }
        }
        manga.tomes.sort((a, b) => a.numero - b.numero);
      } else {
        let initialTomes = [];
        for (let i = 1; i <= tomeNum; i++) {
          const estPossede = (i === tomeNum) || inclurePrecedents;
          initialTomes.push({ numero: i, possede: estPossede, lu: false });
        }
        bibliotheque.push({
          titre: titre,
          auteur: '',
          couverture: '',
          tomes: initialTomes
        });
        mangaIndex = bibliotheque.length - 1;
      }

      sauvegarder();
    }

    function ajouterManuel() {
      const titre = prompt("Titre de la série :");
      if (!titre) return;
      let tomeNum = parseInt(prompt("Numéro du tome possédé :", "1")) || 1;
      enregistrerSerie(titre.trim(), tomeNum);
    }

    rendreVues();
  </script>
</body>
</html>
