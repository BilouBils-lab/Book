<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ma Bibliothèque Manga</title>

  <!-- PWA iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mangas">
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/180/manga.png">
  <link rel="manifest" href='data:application/manifest+json,{"name":"Suivi Manga","short_name":"Mangas","start_url":"./index.html","display":"standalone","background_color":"#121212","theme_color":"#121212"}'>

  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent: #007aff;
      --accent-green: #34c759;
      --text-main: #ffffff;
      --text-sub: #a0a0a0;
      --border-color: #2c2c2e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 90px;
    }

    header {
      position: sticky;
      top: 0;
      background-color: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      z-index: 100;
    }

    header h1 {
      font-size: 22px;
      font-weight: 700;
    }

    .stats {
      font-size: 13px;
      color: var(--text-sub);
      text-align: right;
    }

    .stats strong {
      color: var(--accent);
      font-size: 15px;
    }

    main {
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    .manga-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
      display: flex;
      gap: 14px;
      border: 1px solid var(--border-color);
      position: relative;
    }

    .cover-container {
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
    }

    .cover {
      width: 75px;
      height: 110px;
      border-radius: 8px;
      object-fit: cover;
      background-color: #2c2c2e;
      display: block;
    }

    .cover-edit-badge {
      position: absolute;
      bottom: 4px;
      right: 4px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    .manga-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .manga-title {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .manga-author {
      font-size: 13px;
      color: var(--text-sub);
    }

    .manga-parution {
      font-size: 12px;
      color: var(--accent-green);
      margin-top: 4px;
      font-weight: 500;
    }

    .btn-check-parution {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 6px;
    }

    .volumes-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .volume-badge {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: #2c2c2e;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }

    .volume-badge.owned {
      background: rgba(0, 122, 255, 0.2);
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .volume-badge.read {
      background: var(--accent);
      color: #fff;
    }

    .actions-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      background: rgba(30, 30, 30, 0.9);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 8px 16px;
      border-radius: 30px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 99;
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-secondary {
      background: #2c2c2e;
      color: white;
    }

    .app-version {
      position: fixed;
      bottom: 8px;
      right: 12px;
      font-size: 10px;
      color: var(--text-sub);
      opacity: 0.6;
      z-index: 98;
      font-family: monospace;
      pointer-events: none;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9);
      z-index: 200;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    #interactive.viewport {
      width: 100%;
      max-width: 400px;
      height: 300px;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      background: #000;
    }

    #interactive.viewport video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-sub);
    }
  </style>

  <script src="https://unpkg.com/@zxing/library@latest"></script>
</head>
<body>

  <header>
    <h1>Ma bibliothèque</h1>
    <div class="stats">
      <span id="stat-read"><strong>0</strong></span> / <span id="stat-total">0</span> lus
    </div>
  </header>

  <main id="manga-list"></main>

  <div class="actions-bar">
    <button class="btn" onclick="ouvrirScanner()">📷 Scanner ISBN</button>
    <button class="btn btn-secondary" onclick="ajouterManuel()">➕ Manuel</button>
  </div>

  <div class="app-version">v1.2.0</div>

  <div id="scanner-modal" class="modal">
    <h3 style="margin-bottom: 15px;">Scanne le code-barres (ISBN)</h3>
    <div id="interactive" class="viewport">
      <video id="video"></video>
    </div>
    <p id="scan-status" style="margin-top: 15px; color: var(--text-sub); font-size: 14px;">Initialisation de la caméra...</p>
    <button class="btn btn-secondary" style="margin-top: 20px;" onclick="fermerScanner()">Fermer</button>
  </div>

  <script>
    let bibliotheque = JSON.parse(localStorage.getItem('mangas_db')) || [];
    let codeReader = null;

    function sauvegarder() {
      localStorage.setItem('mangas_db', JSON.stringify(bibliotheque));
      afficherBibliotheque();
    }

    function afficherBibliotheque() {
      const container = document.getElementById('manga-list');
      container.innerHTML = '';

      let totalLus = 0;
      let totalTomes = 0;

      if (bibliotheque.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <p>Aucun manga dans ta collection.</p>
            <p style="font-size: 13px; margin-top: 8px;">Scanne un code-barres pour démarrer !</p>
          </div>`;
        document.getElementById('stat-read').innerText = 0;
        document.getElementById('stat-total').innerText = 0;
        return;
      }

      bibliotheque.forEach((manga, mangaIndex) => {
        const card = document.createElement('div');
        card.className = 'manga-card';

        let volumesHTML = '';
        manga.tomes.forEach((tome, tomeIndex) => {
          totalTomes++;
          if (tome.lu) totalLus++;

          let classe = 'volume-badge';
          if (tome.lu) classe += ' read';
          else if (tome.possede) classe += ' owned';

          volumesHTML += `<div class="${classe}" onclick="toggleTome(${mangaIndex}, ${tomeIndex})">${tome.numero}</div>`;
        });

        const parutionTxt = manga.tomesParus 
          ? `<div class="manga-parution">📚 ${manga.tomesParus} tome(s) disponible(s)</div>`
          : `<button class="btn-check-parution" id="btn-p-${mangaIndex}" onclick="synchroniserManga(${mangaIndex})">🔄 Auto-détecter parutions & jaquette</button>`;

        card.innerHTML = `
          <div class="cover-container" onclick="modifierJaquette(${mangaIndex})" title="Modifier l'image">
            <img class="cover" src="${manga.couverture || 'https://via.placeholder.com/75x110?text=Manga'}" alt="Couverture" onerror="this.src='https://via.placeholder.com/75x110?text=Pas+d\'image'">
            <div class="cover-edit-badge">✏️</div>
          </div>
          <div class="manga-info">
            <div>
              <div class="manga-title">${manga.titre}</div>
              <div class="manga-author">${manga.auteur || 'Auteur inconnu'}</div>
              ${parutionTxt}
            </div>
            <div class="volumes-grid">
              ${volumesHTML}
              <div class="volume-badge" style="background:#007aff22; color:#007aff;" onclick="ajouterTome(${mangaIndex})">+</div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById('stat-read').innerText = totalLus;
      document.getElementById('stat-total').innerText = totalTomes;
    }

    // --- RECHERCHE AUTOMATIQUE SUR MANGADEX + GOOGLE BOOKS ---
    async function synchroniserManga(mangaIndex) {
      const manga = bibliotheque[mangaIndex];
      const btn = document.getElementById(`btn-p-${mangaIndex}`);
      if (btn) btn.innerText = "🔍 Recherche en cours...";

      let jaquetteTrouvee = null;
      let tomesMax = 0;

      try {
        // 1. API MangaDex (Très efficace pour les mangas)
        const resMD = await fetch(`https://api.mangadex.org/manga?title=${encodeURIComponent(manga.titre)}&limit=1&includes[]=cover_art`);
        const dataMD = await resMD.json();

        if (dataMD.data && dataMD.data.length > 0) {
          const mData = dataMD.data[0];
          const lastVol = parseInt(mData.attributes.lastVolume);
          if (!isNaN(lastVol)) tomesMax = lastVol;

          // Récupération de l'image de couverture MangaDex
          const coverRel = mData.relationships.find(r => r.type === 'cover_art');
          if (coverRel && coverRel.attributes) {
            jaquetteTrouvee = `https://uploads.mangadex.org/covers/${mData.id}/${coverRel.attributes.fileName}.256.jpg`;
          }
        }

        // 2. Fallback Google Books si tomes ou jaquette manquante
        if (tomesMax === 0 || !jaquetteTrouvee) {
          const resGB = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent('intitle:' + manga.titre + ' manga')}&maxResults=20`);
          const dataGB = await resGB.json();

          if (dataGB.items) {
            dataGB.items.forEach(item => {
              const title = item.volumeInfo.title || '';
              const match = title.match(/(?:Vol\.|Tome|T\.)\s*(\d+)/i);
              if (match) {
                const num = parseInt(match[1]);
                if (num > tomesMax) tomesMax = num;
              }
              if (!jaquetteTrouvee && item.volumeInfo.imageLinks?.thumbnail) {
                jaquetteTrouvee = item.volumeInfo.imageLinks.thumbnail.replace('http://', 'https://');
              }
            });
          }
        }

        // Application des résultats
        if (tomesMax > 0) manga.tomesParus = tomesMax;
        if (jaquetteTrouvee && !manga.couverture) manga.couverture = jaquetteTrouvee;

        sauvegarder();

      } catch (e) {
        alert("Erreur lors de la synchronisation réseau.");
        if (btn) btn.innerText = "🔄 Réessayer";
      }
    }

    function modifierJaquette(mangaIndex) {
      const manga = bibliotheque[mangaIndex];
      const nouvelleUrl = prompt(`Coller l'URL de la jaquette pour "${manga.titre}" :`, manga.couverture || "");
      if (nouvelleUrl !== null) {
        manga.couverture = nouvelleUrl.trim();
        sauvegarder();
      }
    }

    function toggleTome(mangaIndex, tomeIndex) {
      const tome = bibliotheque[mangaIndex].tomes[tomeIndex];
      if (!tome.possede) {
        tome.possede = true;
      } else if (tome.possede && !tome.lu) {
        tome.lu = true;
      } else {
        tome.possede = false;
        tome.lu = false;
      }
      sauvegarder();
    }

    function ajouterTome(mangaIndex) {
      const manga = bibliotheque[mangaIndex];
      const dernierNumero = manga.tomes.length > 0 ? manga.tomes[manga.tomes.length - 1].numero : 0;
      manga.tomes.push({ numero: dernierNumero + 1, possede: true, lu: false });
      sauvegarder();
    }

    async function ajouterManuel() {
      const titre = prompt("Titre de la série :");
      if (!titre) return;

      let tomeNum = parseInt(prompt("Numéro du tome :", "1")) || 1;
      ajouterMangaDirect(titre, tomeNum, "", "");
      // Auto-synchro en arrière-plan
      const index = bibliotheque.findIndex(m => m.titre.toLowerCase() === titre.toLowerCase());
      if (index !== -1) synchroniserManga(index);
    }

    async function chercherISBN(isbn) {
      document.getElementById('scan-status').innerText = "Analyse ISBN " + isbn + "...";

      try {
        const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`);
        const data = await res.json();
        if (data.totalItems > 0) {
          const book = data.items[0].volumeInfo;
          traiterEtAjouterManga(book.title, book.authors ? book.authors.join(', ') : '', book.imageLinks?.thumbnail);
          return;
        }
      } catch (e) {}

      try {
        const resOL = await fetch(`https://openlibrary.org/search.json?q=${isbn}`);
        const dataOL = await resOL.json();
        if (dataOL.numFound > 0) {
          const book = dataOL.docs[0];
          const coverId = book.cover_i;
          const couverture = coverId ? `https://covers.openlibrary.org/b/id/${coverId}-M.jpg` : '';
          traiterEtAjouterManga(book.title, book.author_name ? book.author_name.join(', ') : '', couverture);
          return;
        }
      } catch (e) {}

      fermerScanner();
      let titreManuel = prompt(`ISBN non trouvé (${isbn}).\nSaisis le titre du manga :`);
      if (titreManuel) {
        let tomeNum = parseInt(prompt("Numéro du tome :", "1")) || 1;
        ajouterMangaDirect(titreManuel, tomeNum, "", "");
      }
    }

    function traiterEtAjouterManga(titreBrut, auteur, couverture) {
      couverture = couverture ? couverture.replace('http://', 'https://') : '';
      let numeroTome = 1;
      let match = titreBrut.match(/(.*?)(?:\s*(?:Vol\.|Tome|T\.)\s*(\d+))/i);
      let titreSerie = titreBrut;

      if (match) {
        titreSerie = match[1].trim();
        numeroTome = parseInt(match[2]) || 1;
      }

      ajouterMangaDirect(titreSerie, numeroTome, auteur, couverture);
    }

    function ajouterMangaDirect(titreSerie, numeroTome, auteur, couverture) {
      let mangaIndex = bibliotheque.findIndex(m => m.titre.toLowerCase() === titreSerie.toLowerCase());

      if (mangaIndex !== -1) {
        let manga = bibliotheque[mangaIndex];
        if (!manga.tomes.some(t => t.numero === numeroTome)) {
          manga.tomes.push({ numero: numeroTome, possede: true, lu: false });
          manga.tomes.sort((a, b) => a.numero - b.numero);
        }
        if (!manga.couverture && couverture) manga.couverture = couverture;
      } else {
        let initialTomes = [];
        for (let i = 1; i <= numeroTome; i++) {
          initialTomes.push({ numero: i, possede: (i === numeroTome), lu: false });
        }
        bibliotheque.push({
          titre: titreSerie,
          auteur: auteur,
          couverture: couverture,
          tomesParus: null,
          tomes: initialTomes
        });
        mangaIndex = bibliotheque.length - 1;
      }

      sauvegarder();
      fermerScanner();
      synchroniserManga(mangaIndex);
    }

    function ouvrirScanner() {
      document.getElementById('scanner-modal').classList.add('active');
      document.getElementById('scan-status').innerText = "Analyse en cours...";

      codeReader = new ZXing.BrowserMultiFormatReader();
      codeReader.decodeFromVideoDevice(null, 'video', (result, err) => {
        if (result) {
          let code = result.getText();
          if (codeReader) codeReader.reset();
          chercherISBN(code);
        }
      }).catch(err => {
        document.getElementById('scan-status').innerText = "Caméra indisponible.";
      });
    }

    function fermerScanner() {
      if (codeReader) codeReader.reset();
      document.getElementById('scanner-modal').classList.remove('active');
    }

    afficherBibliotheque();
  </script>
</body>
</html>
