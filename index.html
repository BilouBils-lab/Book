<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mes Mangas</title>

  <!-- Configuration iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mangas">
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/180/manga.png">

  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #1a1a1e;
      --card-border: #2a2a30;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --success: #10b981;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: calc(90px + env(safe-area-inset-bottom));
    }

    header {
      position: sticky;
      top: 0;
      background-color: rgba(15, 15, 18, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: calc(12px + env(safe-area-inset-top)) 16px 0 16px;
      border-bottom: 1px solid var(--card-border);
      z-index: 100;
    }

    .top-bars {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .app-title-group {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .app-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .settings-btn {
      background: transparent;
      border: none;
      font-size: 20px;
      color: var(--text-sub);
      cursor: pointer;
      padding: 4px;
    }

    .tabs-nav {
      display: flex;
      gap: 8px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 16px;
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      position: relative;
      text-align: center;
    }

    .tab-btn.active {
      color: var(--text-main);
    }

    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 15%;
      width: 70%;
      height: 3px;
      background-color: var(--accent);
      border-radius: 3px 3px 0 0;
    }

    main {
      padding: 16px;
      max-width: 650px;
      margin: 0 auto;
    }

    .series-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .series-card:active {
      transform: scale(0.99);
    }

    .cover-thumb {
      width: 65px;
      height: 95px;
      border-radius: 6px;
      object-fit: cover;
      background-color: #2a2a30;
      flex-shrink: 0;
    }

    .series-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .series-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
    }

    .series-meta {
      font-size: 13px;
      color: var(--text-sub);
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background-color: #2a2a30;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }

    .progress-bar-fill {
      height: 100%;
      background-color: var(--accent);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .chevron {
      color: var(--text-sub);
      font-size: 18px;
      padding-left: 4px;
    }

    .pal-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pal-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .pal-title {
      font-size: 15px;
      font-weight: 600;
    }

    .pal-tome {
      font-size: 13px;
      color: var(--accent);
      font-weight: 500;
    }

    .btn-read-action {
      background: #2a2a30;
      border: none;
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .actions-bar {
      position: fixed;
      /* Au-dessus de la barre d'accueil de l'iPhone, 20px ailleurs */
      bottom: max(20px, calc(8px + env(safe-area-inset-bottom)));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 99;
      /* Centrée avec left: 50%, la barre n'a que la moitié de l'écran : sans ça, les textes passent à la ligne */
      white-space: nowrap;
    }

    .btn-fab {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 24px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-fab-secondary {
      background: #2a2a30;
      color: var(--text-main);
      border: 1px solid var(--card-border);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
    }

    .btn-secondary {
      background: #2a2a30;
      color: white;
    }

    .modal-field-label {
      font-size: 12px;
      color: var(--text-sub);
      display: block;
      margin-bottom: 6px;
    }

    .modal-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: var(--bg-color);
      color: var(--text-main);
      font-size: 15px;
      margin-bottom: 16px;
    }

    .modal-btn-row {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 200;
      padding: 16px;
      overflow-y: auto;
    }

    .modal-overlay.active {
      display: block;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      position: relative;
    }

    .modal-header {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
    }

    .modal-cover {
      width: 90px;
      height: 135px;
      border-radius: 8px;
      object-fit: cover;
      background: #2a2a30;
      cursor: pointer;
    }

    .modal-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }

    .close-modal {
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: 24px;
      background: none;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
    }

    .volumes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(42px, 1fr));
      gap: 8px;
      margin-top: 16px;
    }

    .tome-box {
      height: 42px;
      border-radius: 8px;
      background: #2a2a30;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      border: 1px solid transparent;
      transition: all 0.15s ease;
      position: relative;
    }

    .tome-box.owned {
      background: rgba(37, 99, 235, 0.15);
      color: var(--accent);
      border-color: var(--accent);
    }

    .tome-box.read {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-sub);
      font-size: 14px;
    }

    .version-tag {
      position: fixed;
      /* Zones de sécurité iOS : évite le coin arrondi de l'écran et la barre d'accueil */
      bottom: calc(6px + env(safe-area-inset-bottom));
      right: calc(10px + env(safe-area-inset-right));
      font-size: 10px;
      color: var(--text-sub);
      opacity: 0.5;
      font-family: monospace;
      pointer-events: none;
    }

    .settings-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    #loader-ia {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 15, 18, 0.9);
      z-index: 300;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--card-border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <header>
    <div class="top-bars">
      <div class="app-title-group">
        <div class="app-title">Ma MangaThèque</div>
        <div style="font-size: 12px; color: var(--text-sub);" id="total-count">0 tomes</div>
      </div>
      <button class="settings-btn" onclick="ouvrirParametres()" aria-label="Réglages">⚙️</button>
    </div>
    <div class="tabs-nav">
      <button class="tab-btn" id="tab-pal-btn" onclick="changerOnglet('pal')">Pile à lire (<span id="pal-count">0</span>)</button>
      <button class="tab-btn active" id="tab-col-btn" onclick="changerOnglet('collection')">Collection</button>
    </div>
  </header>

  <main>
    <div id="view-pal" style="display: none;"></div>
    <div id="collection-toolbar" style="display: flex; gap: 8px; margin-bottom: 12px;">
      <input type="text" id="recherche-input" class="modal-input" style="margin-bottom: 0; flex: 1;" placeholder="Rechercher une série..." oninput="onRechercheInput(this.value)">
      <select id="tri-select" class="modal-input" style="margin-bottom: 0; width: auto; flex-shrink: 0;" onchange="onTriChange(this.value)">
        <option value="alpha" selected>A → Z</option>
        <option value="progression">Progression</option>
        <option value="ajout">Ordre d'ajout</option>
      </select>
    </div>
    <div id="view-collection"></div>
  </main>

  <div class="actions-bar">
    <button class="btn-fab btn-fab-secondary" onclick="declencherScanIA()">📷 Scan IA</button>
    <button class="btn-fab" onclick="ajouterManuel()">➕ Saisie</button>
  </div>

  <input type="file" id="ia-file-input" style="display: none;" accept="image/*" capture="environment" onchange="analyserImageJaquette(event)">

  <div id="loader-ia">
    <div class="spinner"></div>
    <div id="loader-status" style="font-size: 14px; font-weight: 600;">Analyse de la jaquette par l'IA...</div>
  </div>

  <div class="version-tag">v3.9</div>

  <!-- Modal Réglages / Paramètres -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal-content">
      <button class="close-modal" onclick="fermerParametres()">×</button>
      <h2 style="font-size: 18px; margin-bottom: 16px;">Paramètres</h2>
      
      <div class="settings-list">
        <button class="btn btn-secondary" onclick="completerCollection()">✨ Compléter ma collection</button>
        <button class="btn btn-secondary" onclick="configurerCleBooks()">📚 Clé Google Books (optionnelle)</button>
        <button class="btn btn-secondary" onclick="configurerCodeCloud()">🔑 Code de sauvegarde cloud</button>
        <button class="btn btn-secondary" onclick="restaurerDepuisCloud()">☁️ Restaurer depuis le cloud</button>
        <button class="btn btn-secondary" onclick="forcerEnvoiCloud()">⬆️ Forcer l'envoi vers le cloud</button>
        <button class="btn btn-secondary" onclick="exporterSauvegarde()">📥 Exporter la sauvegarde (JSON)</button>
        <button class="btn btn-secondary" onclick="document.getElementById('file-input').click()">📤 Importer la sauvegarde (JSON)</button>
        <button class="btn btn-secondary" onclick="document.getElementById('csv-input').click()">📊 Importer un fichier CSV (Sheets)</button>
      </div>

      <input type="file" id="file-input" style="display: none;" accept=".json" onchange="importerSauvegarde(event)">
      <input type="file" id="csv-input" style="display: none;" accept=".csv" onchange="importerCSV(event)">
      <input type="file" id="cover-file-input" style="display: none;" accept="image/*" onchange="chargerJaquetteFichier(event)">
    </div>
  </div>

  <!-- Modal Détail Série -->
  <div id="detail-modal" class="modal-overlay">
    <div class="modal-content">
      <button class="close-modal" onclick="fermerModal()">×</button>
      <div class="modal-header">
        <div style="position: relative;">
          <img id="modal-cover" class="modal-cover" src="" alt="Jaquette" onclick="ouvrirMenuImage()">
          <div style="position: absolute; bottom: 4px; right: 4px; background: rgba(0,0,0,0.6); color: white; padding: 2px 4px; border-radius: 4px; font-size: 10px;">✏️</div>
        </div>
        <div class="modal-info">
          <h2 id="modal-title" style="font-size: 18px;"></h2>
          <div id="modal-author" style="font-size: 13px; color: var(--text-sub);"></div>
          <div id="modal-meta-extra" style="font-size: 12px; color: var(--text-sub); margin-top: 4px;"></div>
          <button class="btn btn-secondary" style="font-size: 11px; width: auto; padding: 4px 10px; margin-top: 8px;" onclick="ouvrirInfosSerie()">✏️ Infos</button>
        </div>
      </div>

      <div style="font-size: 12px; margin-bottom: 8px; color: var(--text-sub); display: flex; justify-content: space-between; align-items: center;">
        <span>Clic: Statut | Appui long: Supprimer tome</span>
      </div>
      
      <div id="modal-volumes-grid" class="volumes-grid"></div>
      
      <div style="margin-top: 16px; display: flex; justify-content: space-between;">
        <button class="btn btn-secondary" style="font-size: 12px; width: auto;" onclick="ajouterNouveauTomeModal()">+ Ajouter tome</button>
        <button class="btn btn-secondary" style="font-size: 12px; width: auto; background: rgba(239,68,68,0.2); color: #ef4444;" onclick="supprimerSerieActuelle()">Supprimer la série</button>
      </div>
    </div>
  </div>

  <!-- Modal : complétion de la collection -->
  <div class="modal-overlay" id="completion-modal">
    <div class="modal-content" style="max-width: 340px;">
      <h3 style="font-size: 16px; margin-bottom: 12px;">✨ Compléter ma collection</h3>
      <div id="completion-etape" style="font-size: 13px; color: var(--text-sub); margin-bottom: 8px;"></div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="completion-barre" style="width: 0%;"></div></div>
      <div id="completion-bilan" style="font-size: 13px; margin-top: 14px; white-space: pre-line; line-height: 1.4;"></div>
      <button class="btn btn-secondary" id="completion-bouton" style="margin-top: 16px;">Arrêter</button>
    </div>
  </div>

  <!-- Modal générique : confirmation -->
  <div class="modal-overlay" id="confirm-modal">
    <div class="modal-content" style="max-width: 340px;">
      <p id="confirm-message" style="margin-bottom: 20px; white-space: pre-line; line-height: 1.4;"></p>
      <div class="modal-btn-row">
        <button class="btn btn-secondary" id="confirm-cancel">Annuler</button>
        <button class="btn" id="confirm-ok" style="background: #ef4444;">Confirmer</button>
      </div>
    </div>
  </div>

  <!-- Modal générique : saisie série (titre + tome) -->
  <div class="modal-overlay" id="form-serie-modal">
    <div class="modal-content" style="max-width: 340px;">
      <h3 id="form-serie-heading" style="font-size: 16px; margin-bottom: 16px;">Ajouter une série</h3>
      <label class="modal-field-label" for="form-serie-titre">Titre de la série</label>
      <input type="text" id="form-serie-titre" class="modal-input" autocomplete="off">
      <label class="modal-field-label" for="form-serie-tome">Numéro du tome possédé</label>
      <input type="number" id="form-serie-tome" class="modal-input" min="1">
      <div class="modal-btn-row">
        <button class="btn btn-secondary" id="form-serie-cancel">Annuler</button>
        <button class="btn" id="form-serie-ok">Valider</button>
      </div>
    </div>
  </div>

  <!-- Modal générique : saisie texte simple -->
  <div class="modal-overlay" id="form-text-modal">
    <div class="modal-content" style="max-width: 340px;">
      <h3 id="form-text-heading" style="font-size: 16px; margin-bottom: 16px;"></h3>
      <input type="text" id="form-text-input" class="modal-input" autocomplete="off">
      <div class="modal-btn-row">
        <button class="btn btn-secondary" id="form-text-cancel">Annuler</button>
        <button class="btn" id="form-text-ok">Valider</button>
      </div>
    </div>
  </div>

  <!-- Modal : choix de la jaquette -->
  <div class="modal-overlay" id="cover-choice-modal">
    <div class="modal-content" style="max-width: 340px;">
      <h3 style="font-size: 16px; margin-bottom: 16px; text-align: center;">Changer la jaquette</h3>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <button class="btn btn-secondary" id="cover-choice-file">📁 Depuis mon téléphone</button>
        <button class="btn btn-secondary" id="cover-choice-url">🔗 Coller un lien</button>
        <button class="btn btn-secondary" id="cover-choice-cancel" style="background: transparent;">Annuler</button>
      </div>
    </div>
  </div>

  <!-- Modal : informations enrichies de la série -->
  <div class="modal-overlay" id="form-infos-modal">
    <div class="modal-content" style="max-width: 340px;">
      <h3 style="font-size: 16px; margin-bottom: 16px;">Informations sur la série</h3>
      <label class="modal-field-label" for="infos-auteur">Auteur</label>
      <input type="text" id="infos-auteur" class="modal-input" autocomplete="off">
      <label class="modal-field-label" for="infos-genre">Genre</label>
      <input type="text" id="infos-genre" class="modal-input" autocomplete="off">
      <label class="modal-field-label" for="infos-editeur">Maison d'édition</label>
      <input type="text" id="infos-editeur" class="modal-input" autocomplete="off">
      <div id="infos-recherche-status" style="font-size: 11px; color: var(--text-sub); margin-top: -10px; margin-bottom: 14px;"></div>
      <label class="modal-field-label" for="infos-statut">Statut</label>
      <select id="infos-statut" class="modal-input">
        <option value="En cours">En cours</option>
        <option value="Terminée">Terminée</option>
        <option value="En pause">En pause</option>
        <option value="Abandonnée">Abandonnée</option>
      </select>
      <button class="btn btn-secondary" id="infos-relancer-recherche" style="font-size: 12px; margin-bottom: 20px;" onclick="rechercherInfosAuto()">🔍 Relancer la recherche automatique</button>
      <div class="modal-btn-row">
        <button class="btn btn-secondary" id="infos-cancel">Annuler</button>
        <button class="btn" id="infos-ok">Enregistrer</button>
      </div>
    </div>
  </div>

  <script>
    let bibliotheque = [];
    let ongletActif = 'collection';
    let rechercheTexte = '';
    let triActif = 'alpha';
    let serieIndexActive = null;
    let longPressTimer = null;
    let db = null;

    function confirmerAction(message) {
      return new Promise((resolve) => {
        const modal = document.getElementById('confirm-modal');
        document.getElementById('confirm-message').textContent = message;
        modal.classList.add('active');

        const btnOk = document.getElementById('confirm-ok');
        const btnCancel = document.getElementById('confirm-cancel');

        function nettoyer(resultat) {
          modal.classList.remove('active');
          btnOk.removeEventListener('click', onOk);
          btnCancel.removeEventListener('click', onCancel);
          resolve(resultat);
        }
        function onOk() { nettoyer(true); }
        function onCancel() { nettoyer(false); }

        btnOk.addEventListener('click', onOk);
        btnCancel.addEventListener('click', onCancel);
      });
    }

    function demanderSerieEtTome(titreParDefaut, tomeParDefaut, entete) {
      return new Promise((resolve) => {
        const modal = document.getElementById('form-serie-modal');
        const champTitre = document.getElementById('form-serie-titre');
        const champTome = document.getElementById('form-serie-tome');
        document.getElementById('form-serie-heading').textContent = entete || 'Ajouter une série';
        champTitre.value = titreParDefaut || '';
        champTome.value = tomeParDefaut || 1;
        modal.classList.add('active');
        setTimeout(() => champTitre.focus(), 50);

        const btnOk = document.getElementById('form-serie-ok');
        const btnCancel = document.getElementById('form-serie-cancel');

        function nettoyer(resultat) {
          modal.classList.remove('active');
          btnOk.removeEventListener('click', onOk);
          btnCancel.removeEventListener('click', onCancel);
          resolve(resultat);
        }
        function onOk() {
          const titre = champTitre.value.trim();
          if (!titre) { champTitre.focus(); return; }
          const tome = parseInt(champTome.value, 10) || 1;
          nettoyer({ titre, tome });
        }
        function onCancel() { nettoyer(null); }

        btnOk.addEventListener('click', onOk);
        btnCancel.addEventListener('click', onCancel);
      });
    }

    function demanderTexte(entete, valeurParDefaut) {
      return new Promise((resolve) => {
        const modal = document.getElementById('form-text-modal');
        const champ = document.getElementById('form-text-input');
        document.getElementById('form-text-heading').textContent = entete;
        champ.value = valeurParDefaut || '';
        modal.classList.add('active');

    async function configurerCleBooks() {
      const cleActuelle = localStorage.getItem('google_books_api_key') || '';
      const nouvelleCle = await demanderTexte("Clé API Google Books (laisse vide pour l'anonyme) :", cleActuelle);
      if (nouvelleCle !== null) {
        if (nouvelleCle) {
          localStorage.setItem('google_books_api_key', nouvelleCle);
        } else {
          localStorage.removeItem('google_books_api_key');
        }
      }
    }

    function pause(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function fetchAvecReessai(url) {
      const delais = [1000];
      for (let tentative = 0; tentative <= delais.length; tentative++) {
        try {
          const r = await fetchAvecTimeout(url, {}, 6000);
          if (r.ok) {
            return { ok: true, status: r.status, body: await r.json().catch(() => null) };
          }
          if (tentative < delais.length && (r.status === 429 || r.status >= 500)) {
            await pause(delais[tentative]);
            continue;
          }
          return { ok: false, status: r.status, body: null };
        } catch (e) {
          if (tentative < delais.length) {
            await pause(delais[tentative]);
            continue;
          }
          throw e;
        }
      }
    }

    function fetchAvecTimeout(url, options, timeoutMs) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeoutMs);
      return fetch(url, { ...options, signal: controller.signal }).finally(() => clearTimeout(id));
    }

    const WORKER_URL = 'https://manga-gemini-proxy.nabil-chilla.workers.dev';
    let jetonRecherche = 0;

    // --- Infos série : AniList puis Jikan (MyAnimeList), appelés directement depuis le navigateur ---
    // (AniList bloque les requêtes venant des Workers Cloudflare)
    const GENRES_FR = {
      'Action': 'Action', 'Adventure': 'Aventure', 'Comedy': 'Comédie', 'Drama': 'Drame',
      'Ecchi': 'Ecchi', 'Fantasy': 'Fantasy', 'Horror': 'Horreur', 'Mahou Shoujo': 'Magical girl',
      'Mecha': 'Mecha', 'Music': 'Musique', 'Mystery': 'Mystère', 'Psychological': 'Psychologique',
      'Romance': 'Romance', 'Sci-Fi': 'Science-fiction', 'Slice of Life': 'Tranche de vie',
      'Sports': 'Sport', 'Supernatural': 'Surnaturel', 'Thriller': 'Thriller', 'Suspense': 'Suspense',
      'Gourmet': 'Gastronomie', 'Award Winning': null
    };
    const DEMOGRAPHIES = ['Shounen', 'Seinen', 'Shoujo', 'Josei', 'Kids'];
    const STATUTS_ANILIST = { FINISHED: 'Terminée', RELEASING: 'En cours', HIATUS: 'En pause', CANCELLED: 'Abandonnée', NOT_YET_RELEASED: 'En cours' };
    const STATUTS_JIKAN = { 'Finished': 'Terminée', 'Publishing': 'En cours', 'On Hiatus': 'En pause', 'Discontinued': 'Abandonnée', 'Not yet published': 'En cours' };

    function normaliserRecherche(t) {
      return (t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
    }

    function genresFr(demographie, genres) {
      const liste = [demographie, ...genres.slice(0, 3).map(g => g in GENRES_FR ? GENRES_FR[g] : g)].filter(Boolean);
      return liste.length ? liste.join(', ') : null;
    }

    // Parmi les résultats, préfère un titre identique (le plus populaire), sinon le premier
    function choisirResultat(liste, titre, nomsDe, popularite) {
      const cible = normaliserRecherche(titre);
      const exacts = liste.filter(m => nomsDe(m).map(normaliserRecherche).includes(cible));
      return exacts.length ? exacts.sort((a, b) => popularite(b) - popularite(a))[0] : liste[0];
    }

    // Google Books renvoie souvent l'éditeur américain (VIZ Media…) même pour une édition française :
    // on n'accepte que les éditeurs de manga présents en France, sous leur nom usuel.
    const EDITEURS_FR = [
      ['Glénat', /gl[eé]nat/], ['Kana', /\bkana\b/], ['Pika', /\bpika\b/], ['Ki-oon', /ki-?oon/],
      ['Kurokawa', /kurokawa/], ['Tonkam', /tonkam/], ['Delcourt', /delcourt/], ['Kazé', /kaz[eé]/],
      ['Crunchyroll', /crunchyroll/], ['Panini Manga', /panini/], ['Soleil Manga', /soleil/], ['Akata', /akata/],
      ['Doki-Doki', /doki/], ['Casterman', /casterman/], ['Sakka', /sakka/], ['Ototo', /ototo/],
      ['Vega-Dupuis', /\bvega\b/], ['Dupuis', /dupuis/], ['Mangetsu', /mangetsu/], ['Meian', /meian/],
      ['Noeve Grafx', /noeve/], ['Michel Lafon', /michel lafon/], ['Nobi Nobi', /nobi/], ['Taifu', /taifu/],
      ['Black Box', /black box/], ['IMHO', /\bimho\b/], ['Le Lézard Noir', /l[eé]zard noir/],
      ['Komikku', /komikku/], ['Naban', /naban/], ['Ankama', /ankama/], ['Kotoji', /kotoji/],
      ['Omaké Books', /omak[eé]/], ['Hachette', /hachette/], ['Bamboo', /bamboo/], ['Dargaud', /dargaud/],
      ['Shiba', /\bshiba\b/], ['H2T', /\bh2t\b/]
    ];
    function editeurFrancais(nom) {
      const n = (nom || '').toLowerCase();
      const trouve = EDITEURS_FR.find(([, motif]) => motif.test(n));
      return trouve ? trouve[0] : null;
    }

    async function chercherAniList(titre) {
      const query = `query ($search: String) {
        Page(perPage: 8) {
          media(search: $search, type: MANGA, format_in: [MANGA, ONE_SHOT], sort: [SEARCH_MATCH]) {
            id title { romaji english native } synonyms genres tags { name category }
            status volumes popularity coverImage { large }
            staff(perPage: 6) { edges { role node { name { full } } } }
          }
        }
      }`;
      const r = await fetchAvecTimeout('https://graphql.anilist.co', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ query, variables: { search: titre } })
      }, 10000);
      const json = await r.json().catch(() => null);
      if (!r.ok || !json || json.errors) {
        const msg = json && json.errors ? json.errors.map(e => e.message).join('; ') : '';
        throw new Error('HTTP ' + r.status + (msg ? ' : ' + msg : ''));
      }
      const liste = (json.data && json.data.Page && json.data.Page.media) || [];
      if (!liste.length) return { trouve: false };

      const m = choisirResultat(liste, titre,
        m => [m.title.romaji, m.title.english, m.title.native, ...(m.synonyms || [])], m => m.popularity || 0);
      const edges = (m.staff && m.staff.edges) || [];
      const noms = [];
      edges.filter(e => /story|art/i.test(e.role || '')).forEach(e => {
        const nom = e.node && e.node.name && e.node.name.full;
        if (nom && !noms.includes(nom)) noms.push(nom);
      });
      const demo = ((m.tags || []).find(t => t.category === 'Demographic') || {}).name;
      return {
        trouve: true,
        source: 'AniList',
        titreMatch: m.title.romaji || m.title.english,
        auteur: noms.length ? noms.join(', ') : null,
        genre: genresFr(demo, m.genres || []),
        statut: STATUTS_ANILIST[m.status] || null,
        volumes: m.volumes || null,
        couverture: (m.coverImage && m.coverImage.large) || null
      };
    }

    async function chercherJikan(titre) {
      const r = await fetchAvecTimeout('https://api.jikan.moe/v4/manga?limit=8&q=' + encodeURIComponent(titre), {}, 10000);
      const json = await r.json().catch(() => null);
      if (!r.ok || !json) throw new Error('HTTP ' + r.status);
      const liste = (json.data || []).filter(m => !/novel/i.test(m.type || ''));
      if (!liste.length) return { trouve: false };

      const m = choisirResultat(liste, titre,
        m => [m.title, m.title_english, m.title_japanese, ...(m.titles || []).map(t => t.title)], m => m.members || 0);
      // MyAnimeList écrit les noms « Nom, Prénom »
      const auteurs = (m.authors || []).map(a => a.name.split(', ').reverse().join(' '));
      const demo = ((m.demographics || [])[0] || {}).name;
      return {
        trouve: true,
        source: 'MyAnimeList',
        titreMatch: m.title,
        auteur: auteurs.length ? auteurs.join(', ') : null,
        genre: genresFr(DEMOGRAPHIES.includes(demo) ? demo : null, (m.genres || []).map(g => g.name)),
        statut: STATUTS_JIKAN[m.status] || null,
        volumes: m.volumes || null,
        couverture: (m.images && m.images.jpg && m.images.jpg.large_image_url) || null
      };
    }

    // Essaie AniList, puis Jikan si AniList échoue ou ne trouve rien
    async function chercherInfosSerie(titre) {
      const erreurs = [];
      for (const [nom, chercher] of [['AniList', chercherAniList], ['MyAnimeList', chercherJikan]]) {
        try {
          const res = await chercher(titre);
          if (res.trouve) return { ...res, erreurs };
          erreurs.push(nom + ' : titre introuvable');
        } catch (e) {
          erreurs.push(nom + ' : ' + messageErreur(e));
        }
      }
      return { trouve: false, erreurs };
    }
    let infosSuggerees = {};

    function messageErreur(e) {
      return e && e.name === 'AbortError' ? 'délai dépassé' : (e && e.message) || 'erreur inconnue';
    }

    // Gemini via le Worker, avec une nouvelle tentative
    async function demanderIA(titre) {
      for (let tentative = 0; tentative <= 1; tentative++) {
        try {
          const r = await fetchAvecTimeout(WORKER_URL + '/infos', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ titre })
          }, 20000);
          const data = await r.json().catch(() => ({ erreur: 'réponse illisible' }));
          if (r.ok || tentative === 1) return data;
        } catch (e) {
          if (tentative === 1) return { erreur: messageErreur(e) };
        }
        await pause(3000);
      }
    }

    async function chercherEditeurGoogleBooks(titre) {
      const cleBooks = localStorage.getItem('google_books_api_key');
      const cleParam = cleBooks ? '&key=' + encodeURIComponent(cleBooks) : '';
      let erreur = null;
      for (const q of ['intitle:' + titre, titre + ' manga']) {
        try {
          // langRestrict=fr : uniquement les éditions françaises
          const r = await fetchAvecReessai('https://www.googleapis.com/books/v1/volumes?q=' + encodeURIComponent(q) + '&langRestrict=fr&printType=books&maxResults=5' + cleParam);
          if (!r.ok) { erreur = 'HTTP ' + r.status; continue; }
          for (const it of (r.body && r.body.items) || []) {
            const editeur = editeurFrancais(it.volumeInfo && it.volumeInfo.publisher);
            if (editeur) return { editeur };
          }
        } catch (e) {
          erreur = messageErreur(e);
        }
      }
      return { erreur };
    }

    // Cherche les infos d'une série sans rien modifier. `deja` indique les champs déjà renseignés :
    // ils ne sont jamais remplacés. Ordre : AniList / MyAnimeList, Google Books (éditeur), puis l'IA
    // seulement pour ce qui manque encore (quota limité).
    async function collecterInfosSerie(titre, deja) {
      const res = { valeurs: {}, sources: {}, base: null, erreurs: [] };
      const poser = (champ, valeur, source) => {
        if (valeur && !deja[champ] && !res.valeurs[champ]) { res.valeurs[champ] = valeur; res.sources[champ] = source; }
      };

      const [base, livres] = await Promise.all([
        chercherInfosSerie(titre),
        deja.editeur ? null : chercherEditeurGoogleBooks(titre)
      ]);
      res.erreurs.push(...base.erreurs);
      if (base.trouve) {
        res.base = { source: base.source, titreMatch: base.titreMatch };
        poser('auteur', base.auteur, base.source);
        poser('genre', base.genre, base.source);
        poser('statut', base.statut, base.source);
        poser('couverture', base.couverture, base.source);
        poser('tomesTotal', base.volumes, base.source);
      }
      if (livres && livres.editeur) poser('editeur', livres.editeur, 'Google Books');
      else if (livres && livres.erreur) res.erreurs.push('Google Books : ' + livres.erreur);

      const manque = ['auteur', 'genre', 'editeur'].filter(c => !deja[c] && !res.valeurs[c]);
      if (manque.length) {
        const ia = await demanderIA(titre);
        if (ia.erreur) res.erreurs.push('IA : ' + ia.erreur);
        else manque.forEach(c => poser(c, ia[c], 'IA'));
      }
      return res;
    }

    // Champs « déjà renseignés » d'une série (le statut par défaut « En cours » peut être corrigé)
    function champsRenseignes(serie, valeurs) {
      const v = valeurs || serie;
      return {
        auteur: !!v.auteur, genre: !!v.genre, editeur: !!v.editeur,
        statut: !!v.statut && v.statut !== 'En cours',
        couverture: !!serie.couverture, tomesTotal: !!serie.tomesTotal
      };
    }

    const NOMS_CHAMPS = { auteur: 'auteur', genre: 'genre', editeur: 'éditeur', statut: 'statut', couverture: 'jaquette', tomesTotal: 'nombre de tomes' };

    // Ligne de résumé : qui a rempli quoi, et pourquoi des champs restent vides
    function resumerRecherche(res, vides) {
      const parSource = {};
      for (const [champ, source] of Object.entries(res.sources)) (parSource[source] = parSource[source] || []).push(NOMS_CHAMPS[champ]);
      const parties = [];
      if (res.base) parties.push(`${res.base.source} (« ${res.base.titreMatch} ») : ${(parSource[res.base.source] || []).join(', ') || 'rien de nouveau'}`);
      if (parSource['Google Books']) parties.push('Google Books : ' + parSource['Google Books'].join(', '));
      if (parSource['IA']) parties.push('IA (à vérifier) : ' + parSource['IA'].join(', '));
      let texte = parties.join(' · ');
      // Toujours signaler l'échec d'AniList / MyAnimeList, même si l'IA a pris le relais
      const echecsBase = res.base ? [] : res.erreurs.filter(e => /^(AniList|MyAnimeList)/.test(e));
      if (echecsBase.length) texte += (texte ? ' — ' : '') + echecsBase.join(' | ');
      if (vides.length) {
        texte += (texte ? ' — ' : '') + 'Toujours vide : ' + vides.map(c => NOMS_CHAMPS[c]).join(', ');
        const autres = res.erreurs.filter(e => !echecsBase.includes(e));
        if (autres.length) texte += ' [' + autres.join(' | ') + ']';
      }
      return texte;
    }

    async function rechercherInfosAuto() {
      if (serieIndexActive === null) return;
      const jeton = ++jetonRecherche;
      const serie = bibliotheque[serieIndexActive];
      const champ = (id) => document.getElementById(id);
      const statusEl = champ('infos-recherche-status');
      statusEl.textContent = 'Recherche en cours…';

      const saisie = {
        auteur: champ('infos-auteur').value.trim(), genre: champ('infos-genre').value.trim(),
        editeur: champ('infos-editeur').value.trim(), statut: champ('infos-statut').value
      };
      const res = await collecterInfosSerie(serie.titre, champsRenseignes(serie, saisie));
      if (jeton !== jetonRecherche) return;

      const v = res.valeurs;
      if (v.auteur) champ('infos-auteur').value = v.auteur;
      if (v.genre) champ('infos-genre').value = v.genre;
      if (v.editeur) champ('infos-editeur').value = v.editeur;
      if (v.statut) champ('infos-statut').value = v.statut;
      infosSuggerees = { couverture: v.couverture, tomesTotal: v.tomesTotal };

      const vides = ['auteur', 'genre', 'editeur'].filter(c => !champ('infos-' + c).value);
      statusEl.textContent = resumerRecherche(res, vides);
    }

    // --- Compléter toute la collection ---
    const PAUSE_ENTRE_SERIES_MS = 2500; // respecte les limites d'AniList et de Gemini
    let completionArretee = false;

    function serieIncomplete(s) {
      return !s.auteur || !s.genre || !s.editeur || !s.couverture;
    }

    async function completerCollection() {
      const cibles = bibliotheque.filter(serieIncomplete);
      if (!cibles.length) { alert('Toutes tes séries sont déjà complètes 🎉'); return; }
      const minutes = Math.max(1, Math.round(cibles.length * 4 / 60));
      if (!(await confirmerAction(`Compléter ${cibles.length} série(s) incomplète(s) ?\n\nSeuls les champs vides sont remplis, rien n'est écrasé. Compte environ ${minutes} min : garde l'app ouverte.`))) return;

      fermerParametres();
      const modal = document.getElementById('completion-modal');
      const etape = document.getElementById('completion-etape');
      const barre = document.getElementById('completion-barre');
      const bilanEl = document.getElementById('completion-bilan');
      const bouton = document.getElementById('completion-bouton');
      bilanEl.textContent = '';
      barre.style.width = '0%';
      bouton.textContent = 'Arrêter';
      bouton.onclick = () => { completionArretee = true; bouton.textContent = 'Arrêt après cette série…'; };
      completionArretee = false;
      modal.classList.add('active');

      let completees = 0;
      const incompletes = [];
      let traitees = 0;
      for (const serie of cibles) {
        if (completionArretee) break;
        etape.textContent = `${traitees + 1} / ${cibles.length} — ${serie.titre}`;
        try {
          const res = await collecterInfosSerie(serie.titre, champsRenseignes(serie));
          const champs = Object.keys(res.valeurs);
          champs.forEach(c => { serie[c] = res.valeurs[c]; });
          if (champs.length) { completees++; sauvegarderLocal(); }
        } catch (e) {
          console.error('Complétion impossible pour ' + serie.titre, e);
        }
        if (serieIncomplete(serie)) incompletes.push(serie.titre);
        traitees++;
        barre.style.width = Math.round(traitees / cibles.length * 100) + '%';
        if (traitees < cibles.length && !completionArretee) await pause(PAUSE_ENTRE_SERIES_MS);
      }

      sauvegarder();
      etape.textContent = completionArretee ? `Arrêté après ${traitees} série(s) sur ${cibles.length}` : 'Terminé ✅';
      let bilan = `${completees} série(s) enrichie(s).`;
      if (incompletes.length) bilan += `\n\nEncore incomplètes (${incompletes.length}) : ${incompletes.join(', ')}.\nOuvre leur fiche (✏️ Infos) pour compléter à la main ou vérifier le titre.`;
      bilanEl.textContent = bilan;
      bouton.textContent = 'Fermer';
      bouton.onclick = () => modal.classList.remove('active');
    }

    function ouvrirInfosSerie() {
      if (serieIndexActive === null) return;
      const serie = bibliotheque[serieIndexActive];
      document.getElementById('infos-auteur').value = serie.auteur || '';
      document.getElementById('infos-genre').value = serie.genre || '';
      document.getElementById('infos-editeur').value = serie.editeur || '';
      document.getElementById('infos-statut').value = serie.statut || 'En cours';
      document.getElementById('infos-recherche-status').textContent = '';
      infosSuggerees = {};
      document.getElementById('form-infos-modal').classList.add('active');

      if (!serie.auteur && !serie.genre) {
        rechercherInfosAuto();
      }
    }

    document.getElementById('infos-cancel').addEventListener('click', () => {
      document.getElementById('form-infos-modal').classList.remove('active');
    });

    document.getElementById('infos-ok').addEventListener('click', () => {
      if (serieIndexActive === null) return;
      const serie = bibliotheque[serieIndexActive];
      serie.auteur = document.getElementById('infos-auteur').value.trim();
      serie.genre = document.getElementById('infos-genre').value.trim();
      serie.editeur = document.getElementById('infos-editeur').value.trim();
      serie.statut = document.getElementById('infos-statut').value;
      if (infosSuggerees.couverture && !serie.couverture) serie.couverture = infosSuggerees.couverture;
      if (infosSuggerees.tomesTotal && !serie.tomesTotal) serie.tomesTotal = infosSuggerees.tomesTotal;
      infosSuggerees = {};
      document.getElementById('form-infos-modal').classList.remove('active');
      sauvegarder();
    });

    function ouvrirDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('MangaTrackerDB', 1);
        req.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains('kv')) {
            database.createObjectStore('kv');
          }
        };
        req.onsuccess = (e) => resolve(e.target.result);
        req.onerror = (e) => reject(e.target.error);
      });
    }

    function dbGet(cle) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction('kv', 'readonly');
        const req = tx.objectStore('kv').get(cle);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function dbSet(cle, valeur) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction('kv', 'readwrite');
        const req = tx.objectStore('kv').put(valeur, cle);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    async function initialiserBibliotheque() {
      try {
        db = await ouvrirDB();
        let data = await dbGet('bibliotheque');
        if (!data) {
          const ancien = localStorage.getItem('mangas_db');
          if (ancien) {
            try {
              data = JSON.parse(ancien);
              await dbSet('bibliotheque', data);
              localStorage.removeItem('mangas_db');
            } catch (e) {
              console.error('Migration depuis localStorage impossible', e);
            }
          }
        }
        bibliotheque = data || [];
      } catch (e) {
        console.error('IndexedDB indisponible, dernier recours localStorage', e);
        bibliotheque = JSON.parse(localStorage.getItem('mangas_db')) || [];

    const BACKUP_URL = 'https://manga-gemini-proxy.nabil-chilla.workers.dev/backup';
    let cloudBackupTimer = null;
    let alerteCloudAffichee = false;

    function codeCloud() {
      return localStorage.getItem('cloud_backup_token') || '';
    }

    function genererCodeCloud() {
      const octets = crypto.getRandomValues(new Uint8Array(18));
      return Array.from(octets, o => o.toString(16).padStart(2, '0')).join('');
    }

    async function configurerCodeCloud() {
      const code = await demanderTexte("Code de sauvegarde cloud (le même que BACKUP_TOKEN sur le Worker, et sur tous tes appareils) :", codeCloud() || genererCodeCloud());
      if (code !== null) {
        if (code) {
          localStorage.setItem('cloud_backup_token', code);

        }
      }
    }

    function signalerProblemeCloud(message) {

    async function envoyerVersCloud(forcer) {
      const code = codeCloud();
      if (!code) return { statut: 'sans-code' };
      const entetes = { 'Content-Type': 'application/json', 'X-Backup-Token': code };
      if (forcer) entetes['X-Backup-Force'] = '1';
      const res = await fetch(BACKUP_URL, { method: 'POST', headers: entetes, body: JSON.stringify(bibliotheque) });
      const data = await res.json().catch(() => ({}));
      if (res.ok) return { statut: 'ok' };
      if (res.status === 401) return { statut: 'code-incorrect' };
      if (res.status === 409) return { statut: 'refuse', ancien: data.ancien, nouveau: data.nouveau };
      return { statut: 'erreur', message: data.error || ('HTTP ' + res.status) };
    }

    function sauvegarderLocal() {
      if (db) {
        dbSet('bibliotheque', bibliotheque).catch(e => console.error('Sauvegarde locale impossible', e));

      }
      rendreVues();
    }

    function sauvegarder() {
      sauvegarderLocal();
      clearTimeout(cloudBackupTimer);
      cloudBackupTimer = setTimeout(async () => {
        try {
          const r = await envoyerVersCloud(false);
          if (r.statut === 'code-incorrect') {
            signalerProblemeCloud("Sauvegarde cloud impossible : le code de sauvegarde est incorrect (Paramètres → 🔑 Code de sauvegarde cloud).");
          } else if (r.statut === 'refuse') {
            signalerProblemeCloud(`Sauvegarde cloud bloquée : le cloud contient ${r.ancien} séries et cet appareil seulement ${r.nouveau}.\n\nSi c'est un nouvel appareil, utilise « Restaurer depuis le cloud ». Si tu as vraiment supprimé ces séries, utilise « Forcer l'envoi vers le cloud ».`);
          } else if (r.statut === 'erreur') {
            console.error('Sauvegarde cloud impossible', r.message);
          }
        } catch (e) {
          console.error('Sauvegarde cloud impossible', e);
        }
      }, 2000);
    }

        else if (r.statut === 'code-incorrect') alert("Code de sauvegarde incorrect.");

    function redimensionnerImage(dataUrl, maxDim) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          let width = img.width;
          let height = img.height;
          if (width > height) {
            if (width > maxDim) { height *= maxDim / width; width = maxDim; }
          } else {
            if (height > maxDim) { width *= maxDim / height; height = maxDim; }
          }
          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', 0.8));
        };
        img.onerror = reject;
        img.src = dataUrl;
      });
    }

    const JAQUETTE_DEFAUT = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="90" height="135" viewBox="0 0 90 135">' +
      '<rect width="90" height="135" fill="#2a2a30"/>' +
      '<text x="45" y="62" font-size="28" text-anchor="middle">📚</text>' +
      '<text x="45" y="90" font-size="11" fill="#9ca3af" text-anchor="middle" font-family="sans-serif">Manga</text>' +
      '</svg>'
    );

    function normaliserTitre(t) {
      return (t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase().replace(/\s+/g, ' ');
    }

    async function analyserImageJaquette(event) {
      const file = event.target.files[0];
      if (!file) return;

      const loader = document.getElementById('loader-ia');
      const loaderStatus = document.getElementById('loader-status');
      loaderStatus.textContent = "Analyse de la jaquette par l'IA...";
      loader.style.display = 'flex';

      try {
        const dataUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
        // Réduit la photo avant envoi : bien plus rapide en 4G, et suffisant pour lire la jaquette
        let imageEnvoi = dataUrl;
        let mimeEnvoi = file.type || "image/jpeg";
        try {
          imageEnvoi = await redimensionnerImage(dataUrl, 1024);
          mimeEnvoi = "image/jpeg";
        } catch (e) {
          console.error('Réduction de la photo impossible, envoi en taille originale', e);
        }
        const base64Data = imageEnvoi.split(',')[1];

        const response = await fetch('https://manga-gemini-proxy.nabil-chilla.workers.dev', {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mimeType: mimeEnvoi, data: base64Data })
        });

        if (!response.ok) {
          const detail = await response.json().catch(() => null);
          throw new Error((detail && detail.error) || ('Erreur HTTP ' + response.status));
        }

        const data = await response.json();
        const texteJson = data.candidates && data.candidates[0] && data.candidates[0].content
          && data.candidates[0].content.parts && data.candidates[0].content.parts[0]
          && data.candidates[0].content.parts[0].text;

        if (!texteJson) {
          const raison = data.candidates && data.candidates[0] && data.candidates[0].finishReason;
          throw new Error(raison ? ('analyse bloquée : ' + raison) : 'réponse IA vide');
        }

        const resultat = JSON.parse(texteJson);
        loader.style.display = 'none';

        const saisie = await demanderSerieEtTome(resultat.titre || '', resultat.tome || 1, "L'IA a détecté :");
        if (saisie) {
          await enregistrerSerie(saisie.titre, saisie.tome);

          try {
            const couvertureRedim = await redimensionnerImage(dataUrl, 300);
            const idx = bibliotheque.findIndex(m => normaliserTitre(m.titre) === normaliserTitre(saisie.titre));
            if (idx !== -1) {
              bibliotheque[idx].couverture = couvertureRedim;
              sauvegarder();
            }
          } catch (e) {
            console.error('Redimensionnement jaquette impossible', e);
          }
        }
      } catch (e) {
        console.error('Erreur scan IA', e);
        alert("L'IA n'a pas pu analyser l'image (" + e.message + "). Réessaie ou ajoute la série manuellement.");
      } finally {
        loader.style.display = 'none';
        event.target.value = '';
      }
    }

    function parseCSVLine(text) {
      let p = '', c = '', r = [];
      let q = false;
      for (let i = 0; i < text.length; i++) {
        c = text[i];
        if (c === '"') {
          q = !q;
        } else if (c === ',' && !q) {
          r.push(p.trim());
          p = '';
        } else {
          p += c;
        }
      }
      r.push(p.trim());
      return r;
    }

    function importerCSV(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const lignes = e.target.result.split(/\r?\n/);
        let ajouts = 0;

        lignes.forEach((ligne, index) => {
          if (!ligne.trim() || index === 0) return;
          
          const cols = parseCSVLine(ligne);
          if (cols.length < 2) return;

          const titre = cols[1] ? cols[1].replace(/^"|"$/g, '').trim() : '';
          const brutTomesPossedes = cols[2] ? cols[2].replace(/^"|"$/g, '').trim() : '';
          const tomesLusVal = cols[3] ? parseInt(cols[3].trim()) || 0 : 0;

          if (titre && titre.toLowerCase() !== 'série') {
            importerMangaDepuisCSV(titre, brutTomesPossedes, tomesLusVal);
            ajouts++;
          }
        });

        fermerParametres();
        alert(`${ajouts} série(s) importée(s) avec succès !`);
      };
      reader.readAsText(file);
    }

    function importerMangaDepuisCSV(titreSerie, stringTomes, nbTomesLus) {
      let setPossedes = new Set();
      const matches = stringTomes.match(/\d+/g);
      if (matches) {
        if (stringTomes.includes(',') || stringTomes.includes(';')) {
          matches.forEach(num => setPossedes.add(parseInt(num)));
        } else {
          const max = parseInt(matches[0]);
          for (let i = 1; i <= max; i++) setPossedes.add(i);
        }
      }

      const maxTomeCount = setPossedes.size > 0 ? Math.max(...Array.from(setPossedes), nbTomesLus) : (nbTomesLus || 1);

      let initialTomes = [];
      for (let i = 1; i <= maxTomeCount; i++) {
        const estPossede = setPossedes.has(i) || (matches && matches.length === 1 && i <= parseInt(matches[0]));
        const estLu = i <= nbTomesLus;
        initialTomes.push({
          numero: i,
          possede: estPossede || estLu,
          lu: estLu
        });
      }

      let mangaIndex = bibliotheque.findIndex(m => normaliserTitre(m.titre) === normaliserTitre(titreSerie));

      if (mangaIndex === -1) {
        bibliotheque.push({
          titre: titreSerie,
          auteur: '',
          couverture: '',
          tomes: initialTomes
        });
      } else {
        bibliotheque[mangaIndex].tomes = initialTomes;
      }

      sauvegarder();
    }

    function exporterSauvegarde() {
      if (bibliotheque.length === 0) {

      const downloadAnchor = document.createElement('a');
      downloadAnchor.href = url;

      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function rendreVues() {
      let totalPossedes = 0;
      let elementsPAL = [];

      bibliotheque.forEach((serie, sIndex) => {
        serie.tomes.forEach((tome, tIndex) => {
          if (tome.possede) {
            totalPossedes++;
            if (!tome.lu) {
              elementsPAL.push({ serieIndex: sIndex, tomeIndex: tIndex, titre: serie.titre, numero: tome.numero });
            }
          }
        });
      });

      document.getElementById('total-count').innerText = `${totalPossedes} tome(s)`;
      document.getElementById('pal-count').innerText = elementsPAL.length;

      const containerPAL = document.getElementById('view-pal');
      containerPAL.innerHTML = '';
      if (elementsPAL.length === 0) {
        containerPAL.innerHTML = `<div class="empty-state">Aucun manga dans la pile à lire. 🎉</div>`;
      } else {
        elementsPAL.forEach(item => {
          const div = document.createElement('div');
          div.className = 'pal-item';
          div.innerHTML = `
            <div class="pal-info">
              <div class="pal-title">${item.titre}</div>
              <div class="pal-tome">Tome ${item.numero}</div>
            </div>
            <button class="btn-read-action" onclick="marquerCommeLu(${item.serieIndex}, ${item.tomeIndex})">Marquer lu ✓</button>
          `;
          containerPAL.appendChild(div);
        });
      }

      const containerCol = document.getElementById('view-collection');
      containerCol.innerHTML = '';

      let listeAffichee = bibliotheque.map((serie, i) => ({ serie, indexReel: i }));

      if (rechercheTexte.trim()) {
        const recherche = normaliserTitre(rechercheTexte);
        listeAffichee = listeAffichee.filter(item => normaliserTitre(item.serie.titre).includes(recherche));
      }

      if (triActif === 'alpha') {
        listeAffichee.sort((a, b) => a.serie.titre.localeCompare(b.serie.titre, 'fr', { sensitivity: 'base' }));
      } else if (triActif === 'progression') {
        const pourcentageDe = (serie) => {
          const total = serie.tomes.length;
          const lus = serie.tomes.filter(t => t.lu).length;
          return total > 0 ? lus / total : 0;
        };
        listeAffichee.sort((a, b) => pourcentageDe(b.serie) - pourcentageDe(a.serie));
      }
      // 'ajout' : on garde l'ordre naturel du tableau (ordre d'ajout), rien à trier

      if (bibliotheque.length === 0) {
        containerCol.innerHTML = `<div class="empty-state">Ta collection est vide.<br>Clique sur ⚙️ pour importer un CSV ou sur ➕ pour ajouter une série.</div>`;
      } else if (listeAffichee.length === 0) {
        containerCol.innerHTML = `<div class="empty-state">Aucune série ne correspond à "${rechercheTexte}".</div>`;
      } else {
        listeAffichee.forEach(({ serie, indexReel }) => {
          const possedes = serie.tomes.filter(t => t.possede).length;
          const lus = serie.tomes.filter(t => t.lu).length;
          const totalRef = serie.tomes.length;
          const pourcentage = totalRef > 0 ? Math.min(100, Math.round((lus / totalRef) * 100)) : 0;

          const card = document.createElement('div');
          card.className = 'series-card';
          card.onclick = () => ouvrirModalSerie(indexReel);
          card.innerHTML = `
            <img class="cover-thumb" src="${serie.couverture || JAQUETTE_DEFAUT}" alt="Jaquette" onerror="this.onerror=null; this.src=JAQUETTE_DEFAUT">
            <div class="series-details">
              <div class="series-title">${serie.titre}</div>
              <div class="series-meta">${possedes} possédé(s) · ${lus}/${totalRef} lu(s)</div>
              <div class="progress-bar-bg">
                <div class="progress-bar-fill" style="width: ${pourcentage}%;"></div>
              </div>
            </div>
            <div class="chevron">›</div>
          `;
          containerCol.appendChild(card);
        });
      }

      if (serieIndexActive !== null && bibliotheque[serieIndexActive]) {
        remplirModalSerie(serieIndexActive);
      }
    }

    async function enregistrerSerie(titre, tomeNum) {
      let mangaIndex = bibliotheque.findIndex(m => normaliserTitre(m.titre) === normaliserTitre(titre));
      let inclurePrecedents = false;

      if (tomeNum > 1) {
        inclurePrecedents = await confirmerAction(`Tu ajoutes le tome ${tomeNum} de "${titre}".\n\nPossèdes-tu aussi tous les tomes de 1 à ${tomeNum - 1} ?`);
      }

      if (mangaIndex !== -1) {
        let manga = bibliotheque[mangaIndex];
        for (let i = 1; i <= tomeNum; i++) {
          if ((i === tomeNum) || inclurePrecedents) {
            let tomeExist = manga.tomes.find(t => t.numero === i);
            if (tomeExist) {
              tomeExist.possede = true;
            } else {
              manga.tomes.push({ numero: i, possede: true, lu: false });
            }
          }
        }
        manga.tomes.sort((a, b) => a.numero - b.numero);
      } else {
        let initialTomes = [];
        for (let i = 1; i <= tomeNum; i++) {
          const estPossede = (i === tomeNum) || inclurePrecedents;
          initialTomes.push({ numero: i, possede: estPossede, lu: false });
        }
        bibliotheque.push({
          titre: titre,
          auteur: '',
          genre: '',
          editeur: '',
          statut: 'En cours',
          couverture: '',
          tomes: initialTomes
        });
      }

      sauvegarder();
    }

    async function ajouterManuel() {
      const saisie = await demanderSerieEtTome('', 1, 'Ajouter une série');
      if (!saisie) return;
      await enregistrerSerie(saisie.titre, saisie.tome);
    }

    initialiserBibliotheque();
  </script>
